<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#6366F1" stroke-width="6" stroke-opacity="0.35" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#06B6D4" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 8" />

  <!-- Stylized ASL Hand / Communicator Icon -->
  <g filter="url(#glow)">
    <!-- Palm & Wrist -->
    <path d="M220 370 C220 380, 292 380, 292 370 L296 280 C296 260, 216 260, 216 280 Z" fill="url(#handGrad)" />
    
    <!-- Thumb -->
    <path d="M216 270 C190 260, 160 280, 168 300 C175 320, 210 300, 224 285 Z" fill="url(#handGrad)" />
    
    <!-- Index Finger -->
    <path d="M216 260 L216 160 C216 142, 238 142, 238 160 L238 260 Z" fill="url(#handGrad)" />
    
    <!-- Middle Finger -->
    <path d="M242 260 L242 135 C242 118, 266 118, 266 135 L266 260 Z" fill="url(#handGrad)" />
    
    <!-- Ring Finger -->
    <path d="M270 260 L270 155 C270 138, 292 138, 292 155 L292 260 Z" fill="url(#handGrad)" />
    
    <!-- Pinky Finger -->
    <path d="M296 265 L296 185 C296 170, 316 170, 316 185 L316 270 Z" fill="url(#handGrad)" />
  </g>

  <!-- Joint Keypoints (Neon Cyan) -->
  <circle cx="227" cy="160" r="8" fill="#FFFFFF" stroke="#06B6D4" stroke-width="4" />
  <circle cx="254" cy="135" r="8" fill="#FFFFFF" stroke="#06B6D4" stroke-width="4" />
  <circle cx="281" cy="155" r="8" fill="#FFFFFF" stroke="#06B6D4" stroke-width="4" />
  <circle cx="306" cy="185" r="8" fill="#FFFFFF" stroke="#06B6D4" stroke-width="4" />
  <circle cx="180" cy="285" r="8" fill="#FFFFFF" stroke="#06B6D4" stroke-width="4" />
</svg>
